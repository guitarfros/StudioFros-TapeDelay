name: Build (Linux, Windows, macOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write      # needed to attach files to a GitHub Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-latest,  cmake_args: "" }
          - { name: windows, os: windows-latest, cmake_args: "" }
          - { name: macos,   os: macos-latest,   cmake_args: "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0" }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev libcurl4-openssl-dev

      - name: DSP engine tests (Linux)
        if: runner.os == 'Linux'
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -ISource tests/engine_test.cpp -o engine_test
          ./engine_test

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSTUDIOFROS_INSTALL_AFTER_BUILD=OFF ${{ matrix.cmake_args }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/pkg
          ART="build/StudioFros_artefacts/Release"
          cp -R "$ART/VST3/." dist/pkg/
          mkdir -p dist/pkg/Standalone
          cp -R "$ART/Standalone/." dist/pkg/Standalone/
          cp LICENSE ASSETS_LICENSE.md dist/pkg/
          cd dist/pkg
          cmake -E tar cf "../StudioFros-TapeDelay-${{ matrix.name }}.zip" --format=zip -- .

      - uses: actions/upload-artifact@v4
        with:
          name: StudioFros-TapeDelay-${{ matrix.name }}
          path: dist/StudioFros-TapeDelay-${{ matrix.name }}.zip

  release:
    name: Attach to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.zip
